[project]
name = "my-diffusion-webui"
version = "0.1.0"
description = "Web UI for the my-diffusion HTTP API: a small server that serves the pages and forwards calls to the API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.scripts]
my-diffusion-webui = "my_diffusion_webui.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_diffusion_webui"]
